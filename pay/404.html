    <!-- TwentySix · Zigbert shell — auth gate + URL normalisation (runs before the Vite bundle) -->
    <script>
      (function () {
        var KEY = "demo-client-dashboard:temp-auth";
        // Home = the platform root, base-path aware (works at /pay/ and /<repo>/pay/).
        function homePath() {
          var p = window.location.pathname.replace(/\/(pay|benefits)(\/.*)?$/, "");
          return (p || "") + "/";
        }
        function isAuthed() {
          try {
            var raw = localStorage.getItem(KEY);
            if (raw) { var pj = JSON.parse(raw); if (pj && pj.username) return true; }
          } catch (e) {}
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf("sb-") === 0 && k.indexOf("-auth-token") !== -1) return true;
            }
          } catch (e) {}
          return false;
        }
        if (!isAuthed()) { window.location.replace(homePath()); return; }
        // Normalise /pay/index.html → /pay/ so wouter's base path matches.
        if (window.location.pathname.match(/\/index\.html$/)) {
          var clean = window.location.pathname.replace(/\/index\.html$/, "/");
          window.history.replaceState(null, "", clean + window.location.search + window.location.hash);
        }
      })();
    </script>
